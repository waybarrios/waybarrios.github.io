<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light">
  <title>Technical W logo variants | Wayner Barrios</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=07017545d8dc">
  <style>
    :root { color-scheme: light; --paper: #fff; --ink: #333; --muted: #666; --dark: #171816; --line: #ededed; --space: 1.5rem; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 3rem; background: var(--paper); color: var(--ink); font: .875rem/1.6 Consolas, "Liberation Mono", Menlo, monospace; }
    main { max-width: 64rem; margin-inline: auto; }
    h1 { margin: 0 0 .5rem; font-size: 1.5rem; letter-spacing: -.03em; }
    p { margin: 0 0 2rem; color: var(--muted); }
    .variants { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space); }
    article { min-width: 0; }
    h2 { margin: 0 0 1rem; font-size: .875rem; font-weight: 400; }
    .swatch { display: grid; place-items: center; height: 14rem; border: 1px solid var(--line); }
    .swatch img { display: block; width: 11rem; height: 11rem; filter: brightness(0); opacity: .8; }
    .swatch.dark { border-color: var(--dark); background: var(--dark); }
    .swatch.dark img { filter: brightness(0) invert(.96); opacity: 1; }
    .sizes { display: flex; align-items: center; gap: 1rem; min-height: 4rem; }
    .sizes img { display: block; filter: brightness(0); opacity: .8; }
    a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: .2em; }
    a:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
    footer { margin-top: 2rem; }
    @media (max-width: 42rem) { body { padding: var(--space); } .variants { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>W / Wayner Barrios</h1>
    <p>Three more technical SVG options, shown at full size and at 16, 24, and 32px.</p>
    <div class="variants">
      <article aria-labelledby="trace-title">
        <h2 id="trace-title">D / Trace</h2>
        <div class="swatch"><img src="w-trace.svg" alt="Geometric W with flat steps"></div>
        <div class="swatch dark"><img src="w-trace.svg" alt="Trace W in light ink on dark"></div>
        <div class="sizes" aria-label="Trace W at small sizes"><img src="w-trace.svg" width="16" height="16" alt="16px"><img src="w-trace.svg" width="24" height="24" alt="24px"><img src="w-trace.svg" width="32" height="32" alt="32px"></div>
        <a href="w-trace.svg" download>Download SVG</a>
      </article>
      <article aria-labelledby="split-title">
        <h2 id="split-title">E / Split</h2>
        <div class="swatch"><img src="w-split.svg" alt="W formed from two separated geometric V shapes"></div>
        <div class="swatch dark"><img src="w-split.svg" alt="Split W in light ink on dark"></div>
        <div class="sizes" aria-label="Split W at small sizes"><img src="w-split.svg" width="16" height="16" alt="16px"><img src="w-split.svg" width="24" height="24" alt="24px"><img src="w-split.svg" width="32" height="32" alt="32px"></div>
        <a href="w-split.svg" download>Download SVG</a>
      </article>
      <article aria-labelledby="step-title">
        <h2 id="step-title">F / Step</h2>
        <div class="swatch"><img src="w-step.svg" alt="Stepped W drawn on a square grid"></div>
        <div class="swatch dark"><img src="w-step.svg" alt="Stepped W in light ink on dark"></div>
        <div class="sizes" aria-label="Stepped W at small sizes"><img src="w-step.svg" width="16" height="16" alt="16px"><img src="w-step.svg" width="24" height="24" alt="24px"><img src="w-step.svg" width="32" height="32" alt="32px"></div>
        <a href="w-step.svg" download>Download SVG</a>
      </article>
    </div>
    <footer><a href="preview.html">First three options</a> · <a href="/">Back to website</a></footer>
  </main>
</body>
</html>
